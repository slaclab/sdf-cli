# sssd configuration for the coact-daemon container.

[sssd]
config_file_version = 2
services = nss
domains = SLAC.STANFORD.EDU

[nss]
filter_users = root,munge
filter_groups = root,munge
entry_cache_nowait_percentage = 75
enum_cache_timeout = 300

[domain/SLAC.STANFORD.EDU]
id_provider = ldap
auth_provider = none
access_provider = permit
ldap_uri = ldap://sdfldap001.sdf.slac.stanford.edu
ldap_search_base = dc=sdf,dc=slac,dc=stanford,dc=edu
ldap_schema = rfc2307
ldap_id_mapping = false
ldap_id_use_start_tls = false
ldap_tls_reqcert = never
ldap_tls_cacertdir = /etc/openldap/certs
entry_cache_timeout = 3600
enumerate = false
cache_credentials = false

# Short timeouts so an unreachable directory cannot stall a batch job.
ldap_network_timeout = 5
ldap_opt_timeout = 10
ldap_search_timeout = 10
