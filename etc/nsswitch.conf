# NSS configuration for the coact-daemon container.
#
# Local files only: the image has no sssd.  sacct's User column is resolved by
# slurmdbd, and the users the image needs (slurm, munge, coact-bot) are local.

passwd:     files
group:      files
shadow:     files
gshadow:    files

hosts:      files dns myhostname
networks:   files

protocols:  files
services:   files
ethers:     files
rpc:        files

netgroup:   files
automount:  files
publickey:  files
bootparams: files
aliases:    files
